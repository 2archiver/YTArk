# Public display version and Android/package metadata use clean SemVer 2.9.0.
# displayVersion is the human release name ("YTArk 2.9"), which the release
# contract derives from a patch-0 SemVer; the numeric code is derived by
# tools/validate_release.py (major*1000000 + minor*10000 + patch*100).
#
# Recovery identity for the consolidated 2.9 release:
# The 2.9.0 draft (2090000) and the 2.9.1 draft (2090100) were never published:
# both build runs stopped in the userscript bundle step before the repack, sign
# and upload steps, so no APK, artefact, tag or release exists for either. The
# published baseline is v2.8.0 / 2080000, so 2090000 is still the next unused,
# monotonically increasing code and this is not a downgrade of anything a user
# can have installed.
#
# 2.9.0 is a direct, signed in-place update to the published 2.8.0 APK on the
# same TizenTubeCobalt v2.0.2 base. It keeps the package ID, signing identity,
# app data directory and ARMv7-only architecture; no uninstall or Cobalt
# rebuild is required.
#
# The userscript changes require immutable tag s28: the next unused revision
# after the published s27 (2.8.0). The s29 label belonged to the abandoned
# 2.9.1 split and is deliberately not used, so one revision still maps to one
# release and the published s27 bundle is untouched.
versionName=2.9.0
displayVersion=2.9
versionCode=2090000
versionTag=v2.9.0
scriptTag=s28
baseTag=v2.0.2
# YTArk uses the same intentionally public community signing key as Hearth so
# APKs retain a stable Android signing identity without repository secrets.
# The PKCS#12 file is pinned by both its Git commit and Git blob SHA; the checked-in
# certificate fingerprint is independently verified before every build.
communityRepository=2archiver/Hearth
communityCommit=79ffcfa4d718662985e706f2425418da01e15de0
communityKeystorePath=app/signing/phairplay.p12
communityKeystoreBlobSha=1bbeb049cb87e85569fdeee9713291bd8402c579
communityKeyAlias=phairplay
communityKeystorePassword=phairplay
communityKeyPassword=phairplay
