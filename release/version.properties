# Public display version is 2.3 (patch-zero display rule); Android/package metadata uses clean SemVer 2.3.0.
# The numeric code is intentionally above every published YTArk build (2.2.0 = 2020000).
# 2.3.0 is YTArk 2.3 based on TizenTubeCobalt v2.0.2 (not a newer Cobalt engine,
# not a newer YouTube client): exactly one ARMv7 APK (armeabi-v7a). The immutable
# userscript revision moves to s22 because the bundled script changed (OLED Black,
# player cleanup, settings search, YouTube Settings customization, changelog).
# s21 (2.2.0) stays published and unchanged.
versionName=2.3.0
displayVersion=2.3
versionCode=2030000
versionTag=v2.3.0
scriptTag=s22
baseTag=v2.0.2
# YTArk uses the same intentionally public community signing key as Hearth so
# APKs retain a stable Android signing identity without repository secrets.
# The PKCS#12 file is pinned by both its Git commit and Git blob SHA; the checked-in
# certificate fingerprint is independently verified before every build.
communityRepository=2archiver/Hearth
communityCommit=79ffcfa4d718662985e706f2425418da01e15de0
communityKeystorePath=app/signing/phairplay.p12
communityKeystoreBlobSha=1bbeb049cb87e85569fdeee9713291bd8402c579
communityKeyAlias=phairplay
communityKeystorePassword=phairplay
communityKeyPassword=phairplay
