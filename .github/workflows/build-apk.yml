name: Build YTArk APK candidates for Android TV

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default; only the publishing jobs get contents: write.
permissions:
  contents: read

concurrency:
  group: ytark-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  API_LEVEL: "34"
  BUILD_TOOLS: "34.0.0"

jobs:
  publish-userscript-tag:
    name: Build userscript and publish immutable tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == '2archiver/YTArk'
    permissions:
      contents: write
    outputs:
      script_url: ${{ steps.script.outputs.script_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: TizenTube/mods/package-lock.json

      - name: Load release version
        run: python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Build userscript and run feature/TV-control tests
        working-directory: TizenTube/mods
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/*.test.mjs
          npm run build
          node --check ../dist/userScript.js
          grep -q "YTArk Quick Controls" ../dist/userScript.js
          grep -q "YouTube Premium" ../dist/userScript.js
          grep -q "ytark://updates" ../dist/userScript.js
          if grep -Eqi 'Personal[[:space:]]+Tube[[:space:]]+TV' ../dist/userScript.js; then
            echo "Deprecated branding found in generated userscript" >&2
            exit 1
          fi
          echo "Built YTArk userscript: $(wc -c < ../dist/userScript.js) bytes"

      - name: Publish immutable userscript tag and verify exact bytes
        id: script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/publish_script_tag.sh TizenTube/dist/userScript.js
          SCRIPT_URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SCRIPT_TAG}/userScript.js?v="
          SERVED="$RUNNER_TEMP/served-userScript.js"
          verified=false
          for attempt in $(seq 1 20); do
            if curl -fsSL "$SCRIPT_URL" -o "$SERVED" && cmp -s TizenTube/dist/userScript.js "$SERVED"; then
              verified=true
              break
            fi
            echo "Waiting for immutable userscript tag propagation ($attempt/20)."
            sleep 15
          done
          if [ "$verified" != true ]; then
            echo "jsDelivr did not serve the exact immutable release userscript" >&2
            exit 1
          fi
          echo "script_url=$SCRIPT_URL" >> "$GITHUB_OUTPUT"

      - name: Upload built userscript
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ytark-user-script
          path: TizenTube/dist/userScript.js
          if-no-files-found: error
          retention-days: 7

  build-apk-candidates:
    name: Build, package-check both APKs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: publish-userscript-tag
    if: github.repository == '2archiver/YTArk'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download verified userscript bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ytark-user-script
          path: TizenTube/dist

      - name: Load release version
        run: python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Install Android build tools and validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}" "platform-tools"
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ytark-validation"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/ytark-validation/latest-release.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/ytark-validation/published-releases.json"
          python3 tools/validate_release.py check-version \
            --latest-json "$RUNNER_TEMP/ytark-validation/latest-release.json" \
            --releases-json "$RUNNER_TEMP/ytark-validation/published-releases.json"
          test -n "$BASE_TAG"
          gh api "repos/reisxd/TizenTubeCobalt/releases/tags/$BASE_TAG" \
            > "$RUNNER_TEMP/ytark-validation/base-release.json"
          echo "SCRIPT_URL=${{ needs.publish-userscript-tag.outputs.script_url }}" >> "$GITHUB_ENV"

      - name: Prepare pinned YTArk signing key
        env:
          GH_TOKEN: ${{ github.token }}
          YTARK_KEYSTORE_B64: ${{ secrets.YTARK_KEYSTORE_B64 }}
          YTARK_KEYSTORE_PASSWORD: ${{ secrets.YTARK_KEYSTORE_PASSWORD }}
          YTARK_KEY_ALIAS: ${{ secrets.YTARK_KEY_ALIAS }}
          YTARK_KEY_PASSWORD: ${{ secrets.YTARK_KEY_PASSWORD }}
        run: bash tools/prepare_signing_key.sh

      - name: Compile native updater and run Java contract tests
        run: |
          set -euo pipefail
          chmod +x tools/build_android_updater.sh
          tools/build_android_updater.sh "$RUNNER_TEMP/ytark-updater/classes.dex"

      - name: Download and verify both pinned upstream Cobalt bases
        run: |
          set -euo pipefail
          python3 tools/fetch_base_apks.py \
            --release-json "$RUNNER_TEMP/ytark-validation/base-release.json" \
            --base-tag "$BASE_TAG" \
            --output-dir base \
            --checksums-out base-apk-sha256.txt
          python3 tools/validate_release.py check-base-checksums \
            --checksums base-apk-sha256.txt --base-dir base

      - name: Install pinned Apktool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKTOOL_URL="$(gh api repos/iBotPeaches/Apktool/releases/tags/v3.0.3 \
            --jq '.assets[] | select(.name == "apktool_3.0.3.jar") | .browser_download_url')"
          test -n "$APKTOOL_URL"
          curl -fsSL --retry 3 "$APKTOOL_URL" -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Repack matching ARMv7 and ARM64 Cobalt bases
        run: |
          set -euo pipefail
          mkdir -p work
          python3 tools/repack_apk.py \
            --base base/cobalt-arm.apk --architecture armv7 \
            --out "work/${APK_ARMV7%.apk}-unsigned.apk" \
            --updater-dex "$RUNNER_TEMP/ytark-updater/classes.dex" \
            --app-name "$APP_NAME" --app-id "$APP_ID" \
            --script-url "$SCRIPT_URL" --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --apktool "java -jar $RUNNER_TEMP/apktool.jar" \
            --zipalign "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          python3 tools/repack_apk.py \
            --base base/cobalt-arm64.apk --architecture arm64 \
            --out "work/${APK_ARM64%.apk}-unsigned.apk" \
            --updater-dex "$RUNNER_TEMP/ytark-updater/classes.dex" \
            --app-name "$APP_NAME" --app-id "$APP_ID" \
            --script-url "$SCRIPT_URL" --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --apktool "java -jar $RUNNER_TEMP/apktool.jar" \
            --zipalign "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"

      - name: Verify alignment, sign both APKs and validate compiled packages
        run: |
          set -euo pipefail
          zipalign -c -p 4 "work/${APK_ARMV7%.apk}-unsigned.apk"
          zipalign -c -p 4 "work/${APK_ARM64%.apk}-unsigned.apk"
          export YTARK_EXPECTED_CERT_SHA256="$SIGNING_CERT_SHA256"
          bash tools/sign_apks.sh work
          mkdir -p release-assets
          mv "work/${APK_ARMV7%.apk}.apk" "release-assets/$APK_ARMV7"
          mv "work/${APK_ARM64%.apk}.apk" "release-assets/$APK_ARM64"
          for architecture in armv7 arm64; do
            if [ "$architecture" = armv7 ]; then apk="$APK_ARMV7"; else apk="$APK_ARM64"; fi
            zipalign -c -p 4 "release-assets/$apk"
            python3 tools/validate_release.py check-apk \
              --apk "release-assets/$apk" --architecture "$architecture" \
              --cert-file signing/YTArk-cert-sha256.txt \
              --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
              --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          done

      - name: Create and verify both APK checksums
        run: |
          set -euo pipefail
          cp TizenTube/dist/userScript.js release-assets/userScript.js
          cp base-apk-sha256.txt release-assets/base-apk-sha256.txt
          (
            cd release-assets
            sha256sum "$APK_ARMV7" "$APK_ARM64" userScript.js > SHA256SUMS.txt
          )
          python3 tools/validate_release.py check-checksums \
            --checksums release-assets/SHA256SUMS.txt \
            --armv7 "release-assets/$APK_ARMV7" \
            --arm64 "release-assets/$APK_ARM64" \
            --user-script release-assets/userScript.js
          python3 tools/validate_release.py check-base-checksums \
            --checksums release-assets/base-apk-sha256.txt --base-dir base

      - name: Prepare same-ABI prior-version package candidates (static only)
        run: |
          set -euo pipefail
          mkdir -p update-smoke
          : > update-smoke/eligibility.properties
          for architecture in armv7 arm64; do
            python3 tools/prepare_update_smoke.py \
              --latest-json "$RUNNER_TEMP/ytark-validation/latest-release.json" \
              --architecture "$architecture" \
              --artifact-dir update-smoke \
              --output update-smoke/eligibility.properties \
              --cert-file signing/YTArk-cert-sha256.txt \
              --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
              --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          done
          cp "release-assets/$APK_ARMV7" update-smoke/current-ytark-armv7.apk
          cp "release-assets/$APK_ARM64" update-smoke/current-ytark-arm64.apk
          cat update-smoke/eligibility.properties
          echo "These checks compare package metadata and signer only; they do not run adb install or launch an emulator."

      - name: Upload candidate APKs and validation metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ytark-dual-abi-candidates
          path: |
            release-assets/*
            update-smoke/*.apk
            update-smoke/eligibility.properties
          if-no-files-found: error
          retention-days: 30

  publish-draft-release:
    name: Create validated draft release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-apk-candidates
    if: github.repository == '2archiver/YTArk'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load release version
        run: |
          set -euo pipefail
          python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Download candidate APKs and validation metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ytark-dual-abi-candidates
          path: staging

      - name: Create draft release and validate its asset contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SIGNING_CERT_SHA256="$(grep -v '^[[:space:]]*#' signing/YTArk-cert-sha256.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          mkdir -p release-assets
          mv staging/release-assets/* release-assets/
          bash tools/create_release.sh
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 -c '
          import json, sys
          tag = sys.argv[1]
          for release in json.load(sys.stdin):
              if release.get("tag_name") == tag:
                  json.dump(release, sys.stdout)
                  sys.exit(0)
          raise SystemExit(f"Draft release {tag} not found")
          ' "$VERSION_TAG" > "$RUNNER_TEMP/draft-release.json"
          python3 tools/validate_release.py verify-release \
            --release-json "$RUNNER_TEMP/draft-release.json" \
            --state draft
          echo "The release remains a draft. Static packaging checks are not physical-device validation."

      - name: Record unverified runtime acceptance
        run: |
          {
            echo "## YTArk runtime validation status"
            echo "- ARMv7 and ARM64 packaging/manifest/signature checks ran in CI."
            echo "- No physical Google TV / Android device was attached to this workflow."
            echo "- Installation, launch, D-pad interaction, sign-in/guest flow, playback, 2160p streams, captions, and in-place PackageInstaller updates remain unverified."
            echo "- The promotion job publishes this draft once the packaging, checksum and metadata gates pass; it does not add device acceptance evidence."
          } >> "$GITHUB_STEP_SUMMARY"

  promote-stable-release:
    name: Promote validated candidate to stable release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: publish-draft-release
    if: github.repository == '2archiver/YTArk'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load release version
        run: python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Re-validate the draft asset contract before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # releases/tags/<tag> 404s for a draft release, so list and filter by
          # tag exactly the way the draft job does.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 -c '
          import json, sys
          tag = sys.argv[1]
          for release in json.load(sys.stdin):
              if release.get("tag_name") == tag:
                  json.dump(release, sys.stdout)
                  sys.exit(0)
          raise SystemExit(f"Draft release {tag} not found")
          ' "$VERSION_TAG" > "$RUNNER_TEMP/pre-promotion-release.json"
          python3 tools/validate_release.py verify-release \
            --release-json "$RUNNER_TEMP/pre-promotion-release.json" \
            --state draft

      - name: Publish the validated candidate as stable, non-prerelease and latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION_TAG" --draft=false --prerelease=false --latest
          echo "Published $VERSION_TAG as a stable non-prerelease release."

      - name: Install Android build-tools to re-verify the published APK bytes
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "build-tools;${BUILD_TOOLS}" >/dev/null
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Download the validated candidate artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ytark-dual-abi-candidates
          path: candidate

      - name: Verify published metadata, latest resolution, bytes, checksums and signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG" \
            > "$RUNNER_TEMP/published-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/latest-release.json"
          python3 tools/validate_release.py verify-release \
            --release-json "$RUNNER_TEMP/published-release.json" \
            --state published \
            --latest-json "$RUNNER_TEMP/latest-release.json"

          mkdir -p published
          for asset in "$APK_ARMV7" "$APK_ARM64" userScript.js SHA256SUMS.txt \
                       base-apk-sha256.txt NOTICE.md; do
            curl -fsSL --retry 3 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION_TAG/$asset" \
              -o "published/$asset"
          done

          # The promoted bytes must be exactly the bytes the candidate job validated.
          for architecture in armv7 arm64; do
            if [ "$architecture" = armv7 ]; then apk="$APK_ARMV7"; else apk="$APK_ARM64"; fi
            cmp "candidate/release-assets/$apk" "published/$apk"
            python3 tools/validate_release.py check-apk \
              --apk "published/$apk" --architecture "$architecture" \
              --cert-file signing/YTArk-cert-sha256.txt \
              --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
              --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          done
          for asset in userScript.js SHA256SUMS.txt base-apk-sha256.txt; do
            cmp "candidate/release-assets/$asset" "published/$asset"
          done
          python3 tools/validate_release.py check-checksums \
            --checksums published/SHA256SUMS.txt \
            --armv7 "published/$APK_ARMV7" \
            --arm64 "published/$APK_ARM64" \
            --user-script published/userScript.js
          grep -Fq "TizenTubeCobalt $BASE_TAG" published/NOTICE.md
          grep -Fq "GPL-3.0-only" published/NOTICE.md
          {
            echo "## YTArk stable release published"
            echo "- \`$VERSION_TAG\` is published, non-draft, non-prerelease and resolves as GitHub latest."
            echo "- Both APK assets re-downloaded from their official URLs and verified byte-identical to the validated candidates."
            echo "- Compiled manifest, native ABI, alignment, SHA-256 and signing-certificate checks re-ran against the published APKs."
            echo "- Physical TV installation, playback and sign-in persistence were not exercised by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
