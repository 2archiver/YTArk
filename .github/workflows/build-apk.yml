name: Build and publish the YTArk ARMv7 APK

# One trusted pipeline. After a successful main-branch build and every package
# check, the SAME run publishes the exact verified bytes as the stable GitHub
# release; there is no tag-push chain and no manual stage.
#
# Trust boundary:
# - Only 2archiver/YTArk on refs/heads/main may publish, and publication runs
#   after the build job succeeds in this run (explicit `needs`).
# - The build job uses the signing key but holds a read-only token.
# - contents: write is granted to the publish job alone; actions: read is added
#   there because it downloads the artefact this run produced.
# - Pull requests and forks never reach this workflow: it does not listen to
#   pull_request or pull_request_target.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      device_test_notes:
        description: "Optional self-reported notes from a real-device test of this build (never required, never a gate)"
        type: string
        required: false
        default: ""

# Least privilege by default; the publish job raises only what it needs.
permissions:
  contents: read

# One concurrency group across every path that can mutate the release, so the
# automatic main-branch run and a recovery dispatch cannot race. Nothing is ever
# cancelled mid-upload.
concurrency:
  group: ytark-release-publication
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  API_LEVEL: "34"
  BUILD_TOOLS: "34.0.0"

jobs:
  release-guard:
    name: Classify the release state for this version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == '2archiver/YTArk'
    permissions:
      contents: read
    outputs:
      state: ${{ steps.plan.outputs.state }}
      action: ${{ steps.plan.outputs.action }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the existing release (assets must actually validate)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/publish_release.py plan \
            --head-sha "$GITHUB_SHA" --file "$GITHUB_OUTPUT"

  source-validation:
    name: Require successful exact-source CI validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.repository == '2archiver/YTArk' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the exact commit under release consideration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for successful CI on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/require_source_ci.py \
            --head-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --timeout-seconds 2100 \
            --poll-seconds 15 \
            --summary-file "$GITHUB_STEP_SUMMARY"

  build-apk-candidates:
    name: Build and package-check the ARMv7 APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs:
      - release-guard
      - source-validation
    if: github.repository == '2archiver/YTArk' && github.ref == 'refs/heads/main' && needs.release-guard.outputs.build_needed == 'true' && needs.source-validation.result == 'success'
    # Candidate only: no tag, no release, no write token. Signing secrets are
    # used only on push/workflow_dispatch of this repository, never for fork PRs.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Node.js for the userscript build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            TizenTube/mods/package-lock.json
            tools/kotlin/package-lock.json

      - name: Verify the bundled Premium vector wordmark before building
        run: |
          set -euo pipefail
          python3 tools/fetch_premium_logo.py --verify-only --out-dir TizenTube/mods/assets
          python3 tools/build_logo_asset.py --check

      - name: Verify CHANGELOG.md and the bundled changelog data before building
        run: |
          set -euo pipefail
          python3 tools/build_changelog.py --check

      - name: Verify the embedded build metadata before building
        run: |
          set -euo pipefail
          # The packaged app must be able to state its own version offline, so
          # the generated module has to match release/version.properties.
          python3 tools/build_buildinfo.py --check

      - name: Validate the release workflow before it runs
        run: |
          set -euo pipefail
          # Same check ci.yml runs. It resolves every script a step names against
          # that step's working directory, so a wrong relative path — the failure
          # that stopped this job on 2026-10-14 — is reported here in seconds
          # instead of after the userscript build.
          python3 tools/check_workflow_policy.py

      - name: Build and test the userscript bundle
        working-directory: TizenTube/mods
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/*.test.mjs
          npm run build
          node --check ../dist/userScript.js
          # Every required/retired symbol, retired file, markup rule and branding
          # rule lives in release/bundle-contract.json — one contract shared with
          # ci.yml. Do not reintroduce a second copy of the list here: a stale
          # duplicate is exactly what stopped the 2.9 release before repacking.
          # Path is relative to the step's working directory (TizenTube/mods).
          python3 ../../tools/check_bundle_contract.py
          echo "Built YTArk userscript: $(wc -c < ../dist/userScript.js) bytes, sha256 $(sha256sum ../dist/userScript.js | cut -d' ' -f1)"

      - name: Load release version
        run: python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Bind the APK to the immutable userscript URL (the tag is published after the package checks)
        run: |
          set -euo pipefail
          # GITHUB_ENV is available only in subsequent steps, never in the step
          # that writes it. The preceding step provides SCRIPT_TAG here.
          # The tag is published by the publish job of this same run, after every
          # package check has passed, and never for a failed build.
          test -n "${SCRIPT_TAG:-}"
          script_url="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SCRIPT_TAG}/userScript.js?v="
          echo "SCRIPT_URL=$script_url" >> "$GITHUB_ENV"
          echo "Candidate APK script URL: $script_url"

      - name: Install Android build tools and validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}" "platform-tools"
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ytark-validation"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/ytark-validation/latest-release.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/ytark-validation/published-releases.json"
          python3 tools/validate_release.py check-version \
            --latest-json "$RUNNER_TEMP/ytark-validation/latest-release.json" \
            --releases-json "$RUNNER_TEMP/ytark-validation/published-releases.json"
          test -n "$BASE_TAG"
          gh api "repos/reisxd/TizenTubeCobalt/releases/tags/$BASE_TAG" \
            > "$RUNNER_TEMP/ytark-validation/base-release.json"

      - name: Prepare pinned YTArk signing key
        env:
          GH_TOKEN: ${{ github.token }}
          YTARK_KEYSTORE_B64: ${{ secrets.YTARK_KEYSTORE_B64 }}
          YTARK_KEYSTORE_PASSWORD: ${{ secrets.YTARK_KEYSTORE_PASSWORD }}
          YTARK_KEY_ALIAS: ${{ secrets.YTARK_KEY_ALIAS }}
          YTARK_KEY_PASSWORD: ${{ secrets.YTARK_KEY_PASSWORD }}
        run: bash tools/prepare_signing_key.sh

      - name: Compile Kotlin updater and run production contract tests
        run: |
          set -euo pipefail
          chmod +x tools/build_android_updater.sh
          tools/build_android_updater.sh "$RUNNER_TEMP/ytark-updater/classes.dex" 2>&1 | tee "$RUNNER_TEMP/updater-build.log"

      - name: Download and verify the pinned upstream ARMv7 Cobalt base
        run: |
          set -euo pipefail
          python3 tools/fetch_base_apks.py \
            --release-json "$RUNNER_TEMP/ytark-validation/base-release.json" \
            --base-tag "$BASE_TAG" \
            --output-dir base \
            --checksums-out base-apk-sha256.txt
          python3 tools/validate_release.py check-base-checksums \
            --checksums base-apk-sha256.txt --base-dir base

      - name: Install pinned Apktool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKTOOL_URL="$(gh api repos/iBotPeaches/Apktool/releases/tags/v3.0.3 \
            --jq '.assets[] | select(.name == "apktool_3.0.3.jar") | .browser_download_url')"
          test -n "$APKTOOL_URL"
          curl -fsSL --retry 3 "$APKTOOL_URL" -o "$RUNNER_TEMP/apktool.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/apktool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Repack the ARMv7 Cobalt base
        run: |
          set -euo pipefail
          mkdir -p work
          python3 -u tools/repack_apk.py \
            --base base/cobalt-arm.apk --architecture armv7 \
            --out "work/${APK_ARMV7%.apk}-unsigned.apk" \
            --updater-dex "$RUNNER_TEMP/ytark-updater/classes.dex" \
            --app-name "$APP_NAME" --app-id "$APP_ID" \
            --script-url "$SCRIPT_URL" --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --apktool "java -jar $RUNNER_TEMP/apktool.jar" \
            --zipalign "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" 2>&1 | tee "$RUNNER_TEMP/repack.log"

      - name: Verify alignment, sign the ARMv7 APK and validate the compiled package
        run: |
          set -euo pipefail
          zipalign -c -p 4 "work/${APK_ARMV7%.apk}-unsigned.apk"
          export YTARK_EXPECTED_CERT_SHA256="$SIGNING_CERT_SHA256"
          bash tools/sign_apks.sh work
          # Exactly one APK leaves the signing step: a second architecture would
          # fail sign_apks.sh before this point instead of being published.
          stray_count="$(find work -maxdepth 1 -name '*-armv7.apk' ! -name "${APK_ARMV7%.apk}.apk" | wc -l)"
          test "$stray_count" -eq 0
          mkdir -p release-assets
          mv "work/${APK_ARMV7%.apk}.apk" "release-assets/$APK_ARMV7"
          zipalign -c -p 4 "release-assets/$APK_ARMV7"
          # Capture the compiled-manifest evidence from the exact signed bytes
          # BEFORE validation. The permission declarations are also emitted as
          # notice annotations: annotations stay readable through the API even
          # when raw logs expire or the validation below fails, so the dump that
          # decides a release gate is never inaccessible again (this is how the
          # 2026-10-14 compiled protectionLevel failure had to be diagnosed).
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump xmltree \
            "release-assets/$APK_ARMV7" AndroidManifest.xml \
            > work/compiled-manifest.txt
          awk '/E: permission /{keep=3} keep>0{print; keep--}' work/compiled-manifest.txt
          awk '/E: permission /{keep=3} keep>0{
                 line=$0; gsub(/%/, "%25", line); gsub(/\r/, " ", line);
                 printf "::notice title=Compiled permission declaration evidence::%s\n", line; keep--
               }' work/compiled-manifest.txt
          python3 tools/validate_release.py check-apk \
            --apk "release-assets/$APK_ARMV7" --architecture armv7 \
            --cert-file signing/YTArk-cert-sha256.txt \
            --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

      - name: Create and verify the ARMv7 APK checksums
        run: |
          set -euo pipefail
          cp TizenTube/dist/userScript.js release-assets/userScript.js
          cp base-apk-sha256.txt release-assets/base-apk-sha256.txt
          (
            cd release-assets
            sha256sum "$APK_ARMV7" userScript.js > SHA256SUMS.txt
          )
          python3 tools/validate_release.py check-checksums \
            --checksums release-assets/SHA256SUMS.txt \
            --armv7 "release-assets/$APK_ARMV7" \
            --user-script release-assets/userScript.js
          python3 tools/validate_release.py check-base-checksums \
            --checksums release-assets/base-apk-sha256.txt --base-dir base

      - name: Prepare the same-ABI ARMv7 prior-version package candidate (static only)
        run: |
          set -euo pipefail
          mkdir -p update-smoke
          : > update-smoke/eligibility.properties
          python3 tools/prepare_update_smoke.py \
            --latest-json "$RUNNER_TEMP/ytark-validation/latest-release.json" \
            --architecture armv7 \
            --artifact-dir update-smoke \
            --output update-smoke/eligibility.properties \
            --cert-file signing/YTArk-cert-sha256.txt \
            --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          cp "release-assets/$APK_ARMV7" update-smoke/current-ytark-armv7.apk
          cat update-smoke/eligibility.properties
          echo "These checks compare package metadata and signer only; they do not run adb install or launch an emulator."

      - name: Record the candidate manifest (exact artefact layout and digests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/publish_release.py write-manifest \
            --output candidate-manifest.json \
            --candidate-dir . \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
          cat candidate-manifest.json

      - name: Upload the ARMv7 candidate and validation metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ytark-armv7-candidate
          path: |
            release-assets/*
            update-smoke/*.apk
            update-smoke/eligibility.properties
            candidate-manifest.json
          if-no-files-found: error
          retention-days: 30
          # An Actions artefact is not a public release: the publish job below
          # decides whether these bytes become the stable release.

      - name: Surface build diagnostics if a package step fails
        if: failure()
        run: |
          python3 tools/ci_diagnostics.py "$RUNNER_TEMP/updater-build.log" "$RUNNER_TEMP/repack.log"

  publish-release:
    name: Publish the verified ARMv7 APK as the stable release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-guard
      - source-validation
      - build-apk-candidates
    # Explicit dependency on successful exact-source CI and, when needed, a
    # successful build of THIS run for trusted code:
    # a failed or cancelled build can never reach publication.
    # `always()` only lifts GitHub's rule that a job whose needs were skipped is
    # skipped; every gate below still applies, so a failed, cancelled or unguarded
    # build can never reach publication. It is needed because a release that is
    # already published and complete skips the build, and the published bytes
    # still have to be re-verified.
    if: >-
      always()
      && !cancelled()
      && github.repository == '2archiver/YTArk'
      && github.ref == 'refs/heads/main'
      && needs.release-guard.result == 'success'
      && needs.source-validation.result == 'success'
      && needs.build-apk-candidates.result != 'failure'
      && needs.build-apk-candidates.result != 'cancelled'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the exact commit this run built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 17 (apksigner needs a JVM to re-verify the package)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools to re-verify the published package
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "build-tools;${BUILD_TOOLS}" >/dev/null
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Download the candidate artefact produced by this run
        if: needs.release-guard.outputs.build_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n ytark-armv7-candidate -D candidate
          # Show the real extraction layout; the manifest is authoritative.
          find candidate -maxdepth 2 -type f | sort

      - name: Publish, resume or repair the stable release from the verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          YTARK_BUILD_NEEDED: ${{ needs.release-guard.outputs.build_needed }}
          YTARK_DEVICE_TEST_NOTES: ${{ inputs.device_test_notes }}
        run: |
          set -euo pipefail
          args=(--commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --workdir publish-work)
          if [ "$YTARK_BUILD_NEEDED" = "true" ]; then
            args+=(--candidate-dir candidate --manifest candidate/candidate-manifest.json)
          fi
          if [ -n "${YTARK_DEVICE_TEST_NOTES:-}" ]; then
            args+=(--device-test-notes "$YTARK_DEVICE_TEST_NOTES")
          fi
          log="$RUNNER_TEMP/ytark-publish.log"
          if ! python3 -u tools/publish_release.py publish "${args[@]}" \
              --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
              --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
              >"$log" 2>&1; then
            cat "$log"
          # Surface any publication failure as a check annotation: the reason is
          # then visible on the run page without opening the raw job log.
          python3 - "$log" <<'PY'
          import sys

          lines = [
              line for line
              in open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
              if line.strip()
          ]
          # GitHub keeps at most ten error annotations per step, so only the
          # tail is emitted: it always contains the reason for the failure.
          for line in lines[-10:]:
              safe = line.replace("%", "%25").replace("\r", " ").replace("\n", "%0A")
              print(f"::error title=YTArk release publication failed::{safe[:900]}")
          PY
            exit 1
          fi
          cat "$log"

      - name: Load release version
        run: python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Record the public release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG" \
            --jq '{tag: .tag_name, draft: .draft, prerelease: .prerelease, name: .name, assets: [.assets[].name]}'
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '{latest: .tag_name, draft: .draft, prerelease: .prerelease}'
