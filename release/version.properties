# Public display version is 2.5 (patch-zero display rule); Android/package metadata uses clean SemVer 2.5.0.
# The numeric code is intentionally above every published YTArk APK (2.4.0 = 2040000).
# 2.5.0 is a settings cleanup and UX repair release on the same TizenTubeCobalt
# v2.0.2 base (not a newer Cobalt engine, not a newer YouTube client): exactly
# one ARMv7 APK (armeabi-v7a). The immutable userscript revision moves to s24
# because the bundled script changed (explicit-activation guide entry, working
# OLED Black surfaces, installed-version metadata, retired User-Agent profile /
# Fix UI / Presets / Undo Preset). s23 (2.4.0) stays published and unchanged.
versionName=2.5.0
displayVersion=2.5
versionCode=2050000
versionTag=v2.5.0
scriptTag=s24
baseTag=v2.0.2
# YTArk uses the same intentionally public community signing key as Hearth so
# APKs retain a stable Android signing identity without repository secrets.
# The PKCS#12 file is pinned by both its Git commit and Git blob SHA; the checked-in
# certificate fingerprint is independently verified before every build.
communityRepository=2archiver/Hearth
communityCommit=79ffcfa4d718662985e706f2425418da01e15de0
communityKeystorePath=app/signing/phairplay.p12
communityKeystoreBlobSha=1bbeb049cb87e85569fdeee9713291bd8402c579
communityKeyAlias=phairplay
communityKeystorePassword=phairplay
communityKeyPassword=phairplay
