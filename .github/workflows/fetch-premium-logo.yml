name: Fetch the pinned YouTube Premium vector wordmark

# One-off, idempotent provenance job. GitHub-hosted runners have general
# internet access, so this is where the Wikimedia Commons original is downloaded,
# hash-verified against the revision metadata Commons itself reports, sanitized
# and committed back to the branch. Devices never fetch this asset at runtime;
# the userscript bundles the sanitized geometry.
#
# Re-running is safe: when the committed asset already matches the pinned
# revision the job changes nothing.

on:
  push:
    paths:
      - "tools/fetch_premium_logo.py"
      - "tools/build_logo_asset.py"
      - ".github/workflows/fetch-premium-logo.yml"

permissions:
  contents: write

concurrency:
  group: ytark-premium-logo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-logo:
    name: Download, verify, sanitize and commit the vector wordmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == '2archiver/YTArk'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sanitizer contract tests
        run: python3 -m unittest discover -s tools/tests -p "test_premium_logo.py" -v

      - name: Download and verify the pinned Wikimedia revision
        run: |
          set -euo pipefail
          python3 tools/fetch_premium_logo.py \
            --out-dir TizenTube/mods/assets | tee "$RUNNER_TEMP/logo-structure.json"
          {
            echo "## Pinned vector wordmark"
            echo "- Source page: https://commons.wikimedia.org/wiki/File:YouTube_Premium_logo_2024.svg"
            echo "- Pinned revision SHA-1: $(python3 -c 'import json;print(json.load(open("TizenTube/mods/assets/youtube-premium-logo-2024.provenance.json"))["retrieved_sha1"])')"
            echo "- Retrieved bytes: $(python3 -c 'import json;print(json.load(open("TizenTube/mods/assets/youtube-premium-logo-2024.provenance.json"))["retrieved_bytes"])')"
            echo "- Sanitized SHA-256: $(python3 -c 'import json;print(json.load(open("TizenTube/mods/assets/youtube-premium-logo-2024.provenance.json"))["sanitized_sha256"])')"
            echo ""
            echo "### Sanitized structure"
            echo '```json'
            python3 tools/fetch_premium_logo.py --verify-only --out-dir TizenTube/mods/assets
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the verified asset back to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain TizenTube/mods/assets)" ]; then
            echo "The bundled asset already matches the pinned Wikimedia revision."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TizenTube/mods/assets
          git commit -m "Bundle the verified YouTube Premium 2024 vector wordmark

          Downloaded from https://upload.wikimedia.org/wikipedia/commons/8/88/YouTube_Premium_logo_2024.svg
          and verified against the SHA-1 Wikimedia Commons records for this
          revision. Sanitized to self-contained vector geometry (no scripts,
          external references, fonts or raster data)."
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"

      - name: Upload the bundled assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ytark-premium-wordmark
          path: TizenTube/mods/assets/youtube-premium-logo-2024*.svg
          if-no-files-found: error
          retention-days: 30
