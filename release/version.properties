# YTArk single version source of truth.
#
# Every build, release tag, and validation step derives from this file. CI
# greps the canonical 3.0 values in .github/workflows/ci.yml, and
# tools/validate_release.py enforces the version -> versionCode mapping.
#
# Version identity policy:
#   - 3.0.0 is the first clean stable release of the 3.x line (the major step
#     that ships the in-app YTArk Updates page, removes settings search /
#     Cache & Storage / OLED, and replaces Skip Startup Animation with the
#     experimental Faster startup option).
#   - 2.9.0 (published 2026-10-14 06:35 UTC, versionCode 2090000, userscript
#     s28) is the last 2.x release. Its recovery identity is:
#       release https://github.com/2archiver/YTArk/releases/tag/v2.9.0
#       commit  e7cc517a6a0f09176563fe9db2e354cccdc33c15
#       CI run  38522902531
#   - A failed 3.0.0 rebuild reuses these same coordinates (same tag, same
#     versionCode, same scriptTag lineage); only the APK bytes and checksums
#     change. Never reuse an older versionCode for a different versionName:
#     Android treats a lower code as a downgrade.
#
# versionCode mapping (monotonic, enforced by tools/validate_release.py):
#   major * 1,000,000 + minor * 10,000 + patch * 100
#   2.9.0  -> 2090000 (published)
#   3.0.0  -> 3000000 (this line)
#
# scriptTag is the monotonic userscript revision counter; s28 was consumed by
# the published 2.9.0 release, so the 3.0.0 line starts at s29. A rebuild of
# 3.0.0 keeps s29 (the CDN path is keyed by version, not by rebuild count).
versionName=3.0.0
versionCode=3000000
displayVersion=3.0
versionTag=v3.0.0
scriptTag=s29
baseTag=v2.0.2
