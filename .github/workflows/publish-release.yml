name: Publish or repair a reviewed YTArk candidate (recovery)

# Recovery path for the same trusted pipeline. It never rebuilds on its own: it
# publishes the EXACT candidate artefact produced by a successful build-apk.yml
# run for a named commit, or resumes/repairs the release that already exists for
# the configured version tag.
#
# Trust boundary: this workflow is manual-only (workflow_dispatch). It never runs
# for pull requests, forks or pull_request_target, so no untrusted code ever
# sees the release token. The candidate run is verified before anything is
# downloaded: workflow file, head commit, conclusion, event, branch, source
# repository. There is no environment approval gate: the checks above are the
# gate, and publication is automatic once the verified bytes pass validation.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Actions run ID of the successful build-apk.yml candidate run"
        type: string
        required: true
      expected_head_sha:
        description: "Full 40-character commit SHA the candidate was built from"
        type: string
        required: true
      device_test_notes:
        description: "Optional self-reported notes from a real-device test of this build (never required, never a gate)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Shared with build-apk.yml: automatic and recovery publications of the same
# release can never run at the same time, and neither is cancelled mid-upload.
concurrency:
  group: ytark-release-publication
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  BUILD_TOOLS: "34.0.0"

jobs:
  verify-candidate:
    name: Verify the reviewed candidate run (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == '2archiver/YTArk'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the reviewed commit (not the moving branch head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false

      - name: Confirm the candidate run is the reviewed build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_head_sha must be a full commit SHA" >&2; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "candidate_run_id must be numeric" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" > "$RUNNER_TEMP/artifacts.json"
          python3 - "$RUNNER_TEMP/run.json" "$RUNNER_TEMP/artifacts.json" "$EXPECTED_SHA" "$RUN_ID" <<'PY'
          import json, sys

          run_path, artifacts_path, expected, run_id = sys.argv[1:5]
          run = json.load(open(run_path, encoding="utf-8"))
          artifacts = json.load(open(artifacts_path, encoding="utf-8"))
          checks = {
              "workflow file": run.get("path") == ".github/workflows/build-apk.yml",
              "head commit": run.get("head_sha") == expected,
              "conclusion": run.get("conclusion") == "success",
              "trusted event": run.get("event") in ("push", "workflow_dispatch"),
              "main branch": run.get("head_branch") == "main",
              "same repository": run.get("repository", {}).get("full_name") == "2archiver/YTArk",
              "run id": str(run.get("id")) == str(run_id),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Candidate run rejected: " + ", ".join(failed))
          names = [item.get("name") for item in artifacts.get("artifacts", [])]
          expired = [item.get("name") for item in artifacts.get("artifacts", []) if item.get("expired")]
          if "ytark-armv7-candidate" not in names:
              raise SystemExit(
                  "The candidate artefact is gone (expired or deleted). Actions artefact "
                  "retention is 30 days: rerun the build for this commit, or bump "
                  "release/version.properties to the next patch version."
              )
          if expired:
              raise SystemExit("Candidate artefact expired: " + ", ".join(str(n) for n in expired))
          print("Candidate run", run.get("id"), "verified for", expected)
          print("Artefacts:", ", ".join(str(n) for n in names))
          PY

      - name: Require successful CI for the exact candidate source commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          python3 tools/require_source_ci.py \
            --head-sha "$EXPECTED_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            --timeout-seconds 120 \
            --poll-seconds 10 \
            --summary-file "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish, resume or repair the stable release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - verify-candidate
    if: github.repository == '2archiver/YTArk' && needs.verify-candidate.result == 'success'
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_head_sha }}
          persist-credentials: false

      - name: Set up Java 17 (apksigner needs a JVM to re-verify the package)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build-tools to re-verify the published package
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "build-tools;${BUILD_TOOLS}" >/dev/null
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Download the named candidate artefact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n ytark-armv7-candidate -D candidate
          find candidate -maxdepth 2 -type f | sort

      - name: Publish, resume or repair the stable release from the verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          # Dispatch inputs are passed through the environment, never pasted
          # into the shell command line.
          YTARK_COMMIT: ${{ inputs.expected_head_sha }}
          YTARK_RUN_ID: ${{ inputs.candidate_run_id }}
          YTARK_DEVICE_TEST_NOTES: ${{ inputs.device_test_notes }}
        run: |
          set -euo pipefail
          args=(
            --commit "$YTARK_COMMIT"
            --run-id "$YTARK_RUN_ID"
            --candidate-dir candidate
            --manifest candidate/candidate-manifest.json
            --workdir publish-work
          )
          if [ -n "${YTARK_DEVICE_TEST_NOTES:-}" ]; then
            args+=(--device-test-notes "$YTARK_DEVICE_TEST_NOTES")
          fi
          log="$RUNNER_TEMP/ytark-publish.log"
          if ! python3 -u tools/publish_release.py publish "${args[@]}" \
              --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
              --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
              >"$log" 2>&1; then
            cat "$log"
          # Surface any publication failure as a check annotation: the reason is
          # then visible on the run page without opening the raw job log.
          python3 - "$log" <<'PY'
          import sys

          lines = [
              line for line
              in open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
              if line.strip()
          ]
          # GitHub keeps at most ten error annotations per step, so only the
          # tail is emitted: it always contains the reason for the failure.
          for line in lines[-10:]:
              safe = line.replace("%", "%25").replace("\r", " ").replace("\n", "%0A")
              print(f"::error title=YTArk release publication failed::{safe[:900]}")
          PY
            exit 1
          fi
          cat "$log"

      - name: Record the public release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Print the release and latest JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION_TAG" \
            --jq '{tag: .tag_name, draft: .draft, prerelease: .prerelease, name: .name, assets: [.assets[].name]}'
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '{latest: .tag_name, draft: .draft, prerelease: .prerelease}'
