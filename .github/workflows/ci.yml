name: Validate YTArk source and ARMv7-only release contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Userscript, vector asset, ABI, repacker and updater tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: TizenTube/mods/package-lock.json
        # actions are pinned to full commit SHAs (supply-chain hardening)

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify the bundled Premium vector wordmark and its provenance
        run: |
          set -euo pipefail
          # The sanitized vector must still match the recorded Commons revision
          # hashes and the generated module must be exactly what the committed
          # asset produces: a drifted or hand-edited wordmark fails here.
          python3 tools/fetch_premium_logo.py --verify-only \
            --out-dir TizenTube/mods/assets
          python3 tools/build_logo_asset.py --check

      - name: Verify CHANGELOG.md and the bundled changelog data
        run: |
          set -euo pipefail
          # CHANGELOG.md is the single source for the in-app reader and the
          # release notes; a stale or hand-edited generated module fails here.
          python3 tools/build_changelog.py --check
          python3 tools/build_changelog.py release-notes --version "$(sed -n 's/^versionName=//p' release/version.properties)" > /dev/null

      - name: Verify the embedded build metadata
        run: |
          set -euo pipefail
          # About YTArk reports the version this build was packaged with, so the
          # generated module must match release/version.properties exactly. A
          # stale, missing or hand-edited file fails here instead of shipping an
          # app that cannot state its own version offline.
          python3 tools/build_buildinfo.py --check
          python3 tools/build_buildinfo.py json

      - name: Test and build the YTArk userscript
        working-directory: TizenTube/mods
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/*.test.mjs
          npm run build
          node --check ../dist/userScript.js
          grep -q "YouTube Premium" ../dist/userScript.js
          # 2.3-2.9 features and the bundled changelog must be in the artefact.
          for needle in ytark-theme-oled ytark-no-player-scrim featuredChannel YTARK_SEARCH_OPEN \
              YTARK_YTS_RESTORE_CONFIRM YTARK_CHANGELOG_SHOW v2.0.2-personal.14 configSchemaVersion \
              enableYtarkGuideEntry recheck-arch "Could not confirm this device" \
              YTARK_GUIDE_SETTINGS_OPEN YTARK_VERSION_REREAD apkAsset \
              ytark-user-agent-retired ytLrOverlayPanelRendererContent "Newer than the latest stable release" \
              virtualKeyboard data-ytark-keyboard about.buildInfo about.notices \
              "Third-party notices and licences" "Added Full Auto Updating" \
              enablePlaybackRecovery YTARK_NATIVE_STORAGE_OPEN YTARK_NATIVE_UPDATES_OPEN \
              "Automatic playback recovery" "Cache & Storage" "Android's system splash"; do
            grep -q "$needle" ../dist/userScript.js || { echo "Bundle is missing $needle" >&2; exit 1; }
          done
          # The 2.5 removals must not survive as live code. Two files name the
          # retired things on purpose and are excluded from the source grep:
          # the bundled changelog narrates the removal, and config.js lists the
          # retired keys so the one-shot migration can delete them. In the
          # artefact only identifiers the history never mentions are checked.
          for retired in quickControls RESET_USER_AGENT_PROFILE DEVICE_PROFILES; do
            if grep -q "$retired" ../dist/userScript.js; then
              echo "The generated userscript still carries the removed $retired" >&2
              exit 1
            fi
          done
          test ! -e features/userAgentSpoofing.js
          test ! -e features/tvControls.js
          for retired in "YTArk Quick Controls" TV_APPLY_PRESET TV_UNDO_PRESET TV_SET_QUALITY \
              enableFixedUI app-quality-root tvLastPresetSnapshot tvQuickQuality; do
            if grep -rqF --include='*.js' --exclude-dir=tests --exclude-dir=assets \
                --exclude=config.js --exclude=userAgentRetirement.js "$retired" .; then
              echo "Removed in 2.5 but still in the shipped sources: $retired" >&2
              exit 1
            fi
          done
          # The bundled wordmark is real vector geometry: no <text> node, no
          # <image>, no external href to an image host, and no runtime fetch.
          if grep -Eqi '<text|<image|href="http|url\(https?:' ../dist/userScript.js; then
            echo "The generated userscript must not carry text/raster/external logo content" >&2
            exit 1
          fi
          grep -q "ytark-premium-ink" ../dist/userScript.js
          if grep -Eqi 'Personal[[:space:]]+Tube[[:space:]]+TV' ../dist/userScript.js; then
            echo "Deprecated product branding found in generated userscript" >&2
            exit 1
          fi

      - name: Validate Python, shell, icon/manifest patcher self-tests and release metadata
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py tools/tests/*.py
          python3 -m unittest discover -s tools/tests -v
          bash -n tools/*.sh
          python3 tools/repack_apk.py --self-test
          python3 tools/render_launcher_art.py --check
          python3 tools/check_no_secrets.py --history
          python3 tools/check_workflow_policy.py
          python3 tools/validate_release.py emit-env --file "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'VERSION_NAME=2.9.0' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'DISPLAY_VERSION=2.9' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'VERSION_CODE=2090000' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'VERSION_TAG=v2.9.0' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'SCRIPT_TAG=s28' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'APK_ARMV7=YTArk-v2.9.0-armv7.apk' "$RUNNER_TEMP/ytark-release.env"
          # ARMv7 is the only published architecture; an ARM64 asset name must
          # not exist anywhere in the release environment or the active pipeline.
          if grep -q 'ARM64' "$RUNNER_TEMP/ytark-release.env"; then
            echo "The release environment still advertises an ARM64 asset" >&2
            exit 1
          fi
          # tools/tests keeps the historical ARM64 asset names on purpose: they
          # prove that the updater and the checksum contract reject them.
          if grep -rlniE 'cobalt-arm64|APK_ARM64|ytark-dual-abi' \
              .github/workflows/build-apk.yml .github/workflows/publish-release.yml \
              .github/workflows/fetch-premium-logo.yml \
              release README.md docs tools/*.sh tools/*.py; then
            echo "ARM64 release plumbing is still present in the active pipeline" >&2
            exit 1
          fi
          actual_cert="$(openssl x509 -in signing/YTArk-release-cert.pem -outform DER | sha256sum | awk '{print $1}')"
          expected_cert="$(grep -v '^[[:space:]]*#' signing/YTArk-cert-sha256.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test "$actual_cert" = "$expected_cert"
          grep -Fxq 'communityRepository=2archiver/Hearth' release/signing.properties
          grep -Fq 'enableAdBlock: true' TizenTube/mods/config.js
          grep -Fq "enablePremiumLogo: true" TizenTube/mods/config.js
          grep -Fq 'baseTag=v2.0.2' release/version.properties
          # The release pipeline is automatic: build-apk.yml publishes the
          # verified candidate itself, and no workflow may gate publication on a
          # manual approval stage or on device-acceptance evidence.
          grep -Fq 'group: ytark-release-publication' .github/workflows/build-apk.yml
          grep -Fq 'group: ytark-release-publication' .github/workflows/publish-release.yml
          grep -Fq 'name: Publish the verified ARMv7 APK as the stable release' .github/workflows/build-apk.yml
          if grep -rniE '(device_acceptance|^\s*environment:)' \
              .github/workflows/build-apk.yml \
              .github/workflows/publish-release.yml \
              .github/workflows/fetch-premium-logo.yml; then
            echo "A manual approval/acceptance gate is back in the release workflow" >&2
            exit 1
          fi
          # The production publisher must refuse any repository but the trusted
          # one, classify an empty release as repairable, and treat a complete
          # published release as a no-op.
          python3 tools/publish_release.py self-check

      - name: Test native updater ABI, release, install-gate and storage contracts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ytark-version-tests"
          UPDATER=android-updater/src/main/java/io/github/twoarchiver/ytark/updater
          TESTS=android-updater/src/test/java/io/github/twoarchiver/ytark/updater
          javac --release 8 -d "$RUNNER_TEMP/ytark-version-tests" \
            "$UPDATER/NativeAbiContract.java" \
            "$UPDATER/UpdateResumeContract.java" \
            "$UPDATER/UpdateVersion.java" \
            "$UPDATER/UpdateReleaseContract.java" \
            "$UPDATER/UpdateSchedulePolicy.java" \
            "$UPDATER/YtarkBranding.java" \
            "$UPDATER/InstallGate.java" \
            "$UPDATER/UpdateGuards.java" \
            "$UPDATER/UpdateFailure.java" \
            "$UPDATER/UpdateFailureException.java" \
            "$TESTS"/*Test.java
          for test_class in UpdateVersionTest UpdateReleaseContractTest UpdateSchedulePolicyTest \
              YtarkBrandingTest InstallGateTest UpdateGuardsTest; do
            java -cp "$RUNNER_TEMP/ytark-version-tests" "io.github.twoarchiver.ytark.updater.$test_class"
          done
