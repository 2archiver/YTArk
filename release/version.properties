# Public display version and Android/package metadata use clean SemVer 2.9.1.
# The numeric code is above the published 2.8.0 APK (2080000) and the prior unpublished 2.9.0 draft.
# 2.9.1 is a direct, signed in-place update to the published 2.8.0 APK on the same
# TizenTubeCobalt v2.0.2 base. It keeps the package ID, signing identity, app data
# directory and ARMv7-only architecture; no uninstall or Cobalt rebuild is required.
# The userscript changes require immutable tag s29. Published s27 (2.8.0) remains unchanged.
versionName=2.9.1
displayVersion=2.9.1
versionCode=2090100
versionTag=v2.9.1
scriptTag=s29
baseTag=v2.0.2
# YTArk uses the same intentionally public community signing key as Hearth so
# APKs retain a stable Android signing identity without repository secrets.
# The PKCS#12 file is pinned by both its Git commit and Git blob SHA; the checked-in
# certificate fingerprint is independently verified before every build.
communityRepository=2archiver/Hearth
communityCommit=79ffcfa4d718662985e706f2425418da01e15de0
communityKeystorePath=app/signing/phairplay.p12
communityKeystoreBlobSha=1bbeb049cb87e85569fdeee9713291bd8402c579
communityKeyAlias=phairplay
communityKeystorePassword=phairplay
communityKeyPassword=phairplay
