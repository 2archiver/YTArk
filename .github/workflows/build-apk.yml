name: Build YTArk APK for Google TV OS 14

on:
  push:
    branches:
      - main
      - arena/fdb8cb92-ytark
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytark-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  API_LEVEL: "34"
  BUILD_TOOLS: "34.0.0"

jobs:
  build:
    name: Build and validate YTArk release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: TizenTube/mods/package-lock.json

      - name: Load release version and install Android build tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}" "platform-tools"
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ytark-validation"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > "$RUNNER_TEMP/ytark-validation/latest-release.json"
          python3 tools/validate_release.py check-version \
            --latest-json "$RUNNER_TEMP/ytark-validation/latest-release.json"
          BASE_TAG_FROM_CONFIG="$(awk -F= '$1 == "baseTag" { print $2 }' release/version.properties)"
          test -n "$BASE_TAG_FROM_CONFIG"
          gh api "repos/reisxd/TizenTubeCobalt/releases/tags/$BASE_TAG_FROM_CONFIG" \
            > "$RUNNER_TEMP/ytark-validation/base-release.json"

      - name: Prepare pinned YTArk signing key
        env:
          GH_TOKEN: ${{ github.token }}
          YTARK_KEYSTORE_B64: ${{ secrets.YTARK_KEYSTORE_B64 }}
          YTARK_KEYSTORE_PASSWORD: ${{ secrets.YTARK_KEYSTORE_PASSWORD }}
          YTARK_KEY_ALIAS: ${{ secrets.YTARK_KEY_ALIAS }}
          YTARK_KEY_PASSWORD: ${{ secrets.YTARK_KEY_PASSWORD }}
        run: bash tools/prepare_signing_key.sh

      - name: Build userscript and run TV controls tests
        working-directory: TizenTube/mods
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/tv-controls.test.mjs
          npm run build
          node --check ../dist/userScript.js
          grep -q "YTArk Quick Controls" ../dist/userScript.js
          grep -q "ytark://updates" ../dist/userScript.js
          if grep -Eqi 'Personal[[:space:]]+Tube[[:space:]]+TV' ../dist/userScript.js; then
            echo "Deprecated branding found in generated userscript" >&2
            exit 1
          fi
          echo "Built YTArk userscript: $(wc -c < ../dist/userScript.js) bytes"

      - name: Publish immutable userscript tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/publish_script_tag.sh TizenTube/dist/userScript.js
          SCRIPT_URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${SCRIPT_TAG}/userScript.js?v="
          SERVED="$RUNNER_TEMP/ytark-validation/served-userScript.js"
          verified=false
          for attempt in $(seq 1 20); do
            if curl -fsSL "$SCRIPT_URL" -o "$SERVED" && cmp -s TizenTube/dist/userScript.js "$SERVED"; then
              verified=true
              break
            fi
            echo "Waiting for the immutable userscript tag to propagate ($attempt/20)."
            sleep 15
          done
          if [ "$verified" != true ]; then
            echo "jsDelivr did not serve the exact release userscript bundle" >&2
            exit 1
          fi
          echo "SCRIPT_URL=$SCRIPT_URL" >> "$GITHUB_ENV"
          echo "jsDelivr serves the exact immutable YTArk userscript tag."

      - name: Compile native Android updater
        run: |
          set -euo pipefail
          chmod +x tools/build_android_updater.sh
          tools/build_android_updater.sh "$RUNNER_TEMP/ytark-updater/classes.dex"

      - name: Download and verify pinned TizenTubeCobalt ARM64 base APK
        run: |
          set -euo pipefail
          python3 tools/fetch_base_apks.py \
            --release-json "$RUNNER_TEMP/ytark-validation/base-release.json" \
            --base-tag "$BASE_TAG" \
            --output-dir base \
            --checksums-out base-apk-sha256.txt

      - name: Install pinned Apktool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKTOOL_URL="$(gh api repos/iBotPeaches/Apktool/releases/tags/v3.0.3 \
            --jq '.assets[] | select(.name == "apktool_3.0.3.jar") | .browser_download_url')"
          test -n "$APKTOOL_URL"
          curl -fsSL --retry 3 "$APKTOOL_URL" -o "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Repack one ARM64 YTArk APK for Google TV OS 14
        run: |
          set -euo pipefail
          mkdir -p work
          UNSIGNED_ARM64="work/${APK_ARM64%.apk}-unsigned.apk"
          python3 tools/repack_apk.py \
            --base base/cobalt-arm64.apk \
            --out "$UNSIGNED_ARM64" \
            --updater-dex "$RUNNER_TEMP/ytark-updater/classes.dex" \
            --app-name "$APP_NAME" \
            --app-id "$APP_ID" \
            --script-url "$SCRIPT_URL" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --apktool "java -jar $RUNNER_TEMP/apktool.jar" \
            --zipalign "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"

      - name: Verify APK alignment
        run: |
          set -euo pipefail
          zipalign -c -p 4 "work/${APK_ARM64%.apk}-unsigned.apk"

      - name: Sign with pinned production certificate
        run: |
          set -euo pipefail
          export YTARK_EXPECTED_CERT_SHA256="$SIGNING_CERT_SHA256"
          bash tools/sign_apks.sh work
          mkdir -p release-assets
          mv "work/${APK_ARM64%.apk}.apk" "release-assets/$APK_ARM64"

      - name: Validate APK identity, ABI, updater components and signer
        run: |
          set -euo pipefail
          python3 tools/validate_release.py check-apk \
            --apk "release-assets/$APK_ARM64" --architecture arm64 \
            --cert-file signing/YTArk-cert-sha256.txt \
            --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

      - name: Create and verify release checksums
        run: |
          set -euo pipefail
          cp TizenTube/dist/userScript.js release-assets/userScript.js
          cp base-apk-sha256.txt release-assets/base-apk-sha256.txt
          (
            cd release-assets
            sha256sum "$APK_ARM64" userScript.js > SHA256SUMS.txt
          )
          python3 tools/validate_release.py check-checksums \
            --checksums release-assets/SHA256SUMS.txt \
            --arm64 "release-assets/$APK_ARM64" \
            --user-script release-assets/userScript.js

      - name: Prepare prior-version update-install smoke test
        run: |
          set -euo pipefail
          mkdir -p update-smoke
          python3 tools/prepare_update_smoke.py \
            --latest-json "$RUNNER_TEMP/ytark-validation/latest-release.json" \
            --artifact-dir update-smoke \
            --output "$GITHUB_OUTPUT" \
            --cert-file signing/YTArk-cert-sha256.txt \
            --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          cp "release-assets/$APK_ARM64" update-smoke/current-ytark-arm64.apk
          if grep -q '^eligible=true$' "$GITHUB_OUTPUT"; then
            echo "A previous YTArk production APK is available for in-place upgrade testing."
          else
            echo "No matching prior production identity exists; the ARM64 smoke test will validate a fresh production install."
          fi

      - name: Create draft release for prepublication validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export SIGNING_CERT_SHA256
          LOG_FILE="$RUNNER_TEMP/ytark-draft-release.log"
          set +e
          (
            set -euo pipefail
            bash tools/create_release.sh
            cp NOTICE.md release-assets/NOTICE.md
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | python3 -c '
          import json, sys
          tag = sys.argv[1]
          for release in json.load(sys.stdin):
              if release.get("tag_name") == tag:
                  json.dump(release, sys.stdout)
                  sys.exit(0)
          raise SystemExit(f"Draft release {tag} not found")
          ' "$VERSION_TAG" > "$RUNNER_TEMP/ytark-validation/draft-release.json"
            python3 tools/validate_release.py verify-release \
              --release-json "$RUNNER_TEMP/ytark-validation/draft-release.json" \
              --state draft
          ) > "$LOG_FILE" 2>&1
          release_status=$?
          set -e
          cat "$LOG_FILE"
          if (( release_status != 0 )); then
            diagnostic="$(python3 - "$LOG_FILE" <<'PY'
          import sys
          from collections import deque
          with open(sys.argv[1], encoding="utf-8", errors="replace") as source:
              print(" | ".join(line.strip() for line in deque(source, maxlen=25) if line.strip()), end="")
          PY
            )"
            diagnostic="${diagnostic//%/%25}"
            printf '::error title=YTArk draft release diagnostics::%s\n' "$diagnostic"
            exit "$release_status"
          fi

      - name: Upload validated draft assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ytark-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARM64 install/upgrade smoke test APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ytark-update-smoke
          path: update-smoke/*.apk
          if-no-files-found: error
          retention-days: 7

  update-install-smoke:
    name: Validate ARM64 production install or in-place update
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Load expected versionCode
        run: python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Download smoke test APKs
        uses: actions/download-artifact@v8.0.2
        with:
          name: ytark-update-smoke
          path: smoke

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 14 (API 34) SDK and build-tools
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}" "platform-tools"
          echo "$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Validate ARM64 Android 14 install/upgrade package and updater deep-link contract
        run: |
          set -euo pipefail
          cp smoke/current-ytark-arm64.apk "smoke/$APK_ARM64"
          python3 tools/validate_release.py check-apk \
            --apk "smoke/$APK_ARM64" --architecture arm64 \
            --cert-file signing/YTArk-cert-sha256.txt \
            --aapt "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          if [ -f smoke/previous-production-arm64.apk ]; then
            prev_badging="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging smoke/previous-production-arm64.apk)"
            echo "$prev_badging" | grep -Fq "package: name='io.github.twoarchiver.ytark'"
            prev_cert="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs smoke/previous-production-arm64.apk \
              | grep -m1 -i 'certificate SHA-256 digest:' | sed -E 's/.*digest:[[:space:]]*//' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            expected_cert="$(grep -v '^[[:space:]]*#' signing/YTArk-cert-sha256.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            test "$prev_cert" = "$expected_cert"
            echo "Verified prior production APK shares package identity and Hearth signing certificate for in-place upgrade."
          else
            echo "Verified first production YTArk APK for clean Android 14 ARM64 install."
          fi
          manifest_tree="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump xmltree "smoke/$APK_ARM64" AndroidManifest.xml)"
          echo "$manifest_tree" | grep -Fq "io.github.twoarchiver.ytark.updater.UpdateActivity"
          echo "$manifest_tree" | grep -Fq "android.intent.action.VIEW"
          echo "$manifest_tree" | grep -Fq "ytark"
          echo "$manifest_tree" | grep -Fq "updates"
          chmod +x tools/build_android_updater.sh
          tools/build_android_updater.sh "$RUNNER_TEMP/ytark-smoke-updater/classes.dex"
          echo "ARM64 YTArk Android 14 install/upgrade and updater deep-link smoke validation passed."

  publish:
    name: Publish stable YTArk release
    needs: [build, update-install-smoke]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.update-install-smoke.result == 'success' || needs.update-install-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Load version metadata
        run: python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Download validated draft assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: ytark-release-assets
          path: release-assets

      - name: Publish draft only after all release validations pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/ytark-publish-release.log"
          set +e
          (
            set -euo pipefail
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$VERSION_TAG\") | .id" | head -n 1)"
            test -n "$RELEASE_ID"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true \
              -f name=YTArk \
              > "$RUNNER_TEMP/ytark-published-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
              > "$RUNNER_TEMP/ytark-latest-release.json"
            python3 tools/validate_release.py verify-release \
              --release-json "$RUNNER_TEMP/ytark-published-release.json" \
              --latest-json "$RUNNER_TEMP/ytark-latest-release.json" \
              --state published
          ) > "$LOG_FILE" 2>&1
          publish_status=$?
          set -e
          cat "$LOG_FILE"
          if (( publish_status != 0 )); then
            diagnostic="$(python3 - "$LOG_FILE" <<'PY'
          import sys
          from collections import deque
          with open(sys.argv[1], encoding="utf-8", errors="replace") as source:
              print(" | ".join(line.strip() for line in deque(source, maxlen=25) if line.strip()), end="")
          PY
            )"
            diagnostic="${diagnostic//%/%25}"
            printf '::error title=YTArk publish release diagnostics::%s\n' "$diagnostic"
            exit "$publish_status"
          fi
