name: Validate YTArk source and ARMv7-only release contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Userscript, vector asset, ABI, repacker and updater tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            TizenTube/mods/package-lock.json
            tools/kotlin/package-lock.json
        # actions are pinned to full commit SHAs (supply-chain hardening)

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify the bundled Premium vector wordmark and its provenance
        run: |
          set -euo pipefail
          # The sanitized vector must still match the recorded Commons revision
          # hashes and the generated module must be exactly what the committed
          # asset produces: a drifted or hand-edited wordmark fails here.
          python3 tools/fetch_premium_logo.py --verify-only \
            --out-dir TizenTube/mods/assets
          python3 tools/build_logo_asset.py --check

      - name: Verify CHANGELOG.md and the bundled changelog data
        run: |
          set -euo pipefail
          # CHANGELOG.md is the single source for the in-app reader and the
          # release notes; a stale or hand-edited generated module fails here.
          python3 tools/build_changelog.py --check
          python3 tools/build_changelog.py release-notes --version "$(sed -n 's/^versionName=//p' release/version.properties)" > /dev/null

      - name: Verify the embedded build metadata
        run: |
          set -euo pipefail
          # About YTArk reports the version this build was packaged with, so the
          # generated module must match release/version.properties exactly. A
          # stale, missing or hand-edited file fails here instead of shipping an
          # app that cannot state its own version offline.
          python3 tools/build_buildinfo.py --check
          python3 tools/build_buildinfo.py json

      - name: Test and build the YTArk userscript
        working-directory: TizenTube/mods
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/*.test.mjs
          npm run build
          node --check ../dist/userScript.js
          # The contract is the single source of truth for the required bundle
          # symbols, the 2.5/2.9 retirements, the retired files, the vector-only
          # wordmark rule and the product branding. build-apk.yml and the
          # userscript tests read the same file, so a feature cannot be retired
          # in one place and still be required in another.
          # Path is relative to the step's working directory (TizenTube/mods).
          python3 ../../tools/check_bundle_contract.py

      - name: Validate Python, shell, icon/manifest patcher self-tests and release metadata
        run: |
          set -euo pipefail
          # A failure inside this step used to be visible only in the raw job log,
          # which expires and is not readable through the API: a red job with no
          # stated reason. Every failing command now names itself as a check
          # annotation, so the failing check is readable from the API alone.
          trap 'code=$?; printf "::error title=Release metadata validation::%s (line %s, exit %s)\n" "$BASH_COMMAND" "$LINENO" "$code"' ERR
          python3 -m py_compile tools/*.py tools/tests/*.py
          # The name of the failing test and its assertion must be readable from
          # the API: raw job logs expire and are not reachable here, so a bare
          # "exit code 1" used to cost a whole debugging cycle per red run.
          if ! python3 -m unittest discover -s tools/tests -v >"$RUNNER_TEMP/unittest.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/unittest.log"
            if ! python3 - "$RUNNER_TEMP/unittest.log" <<'PY'
          import sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          failed = [line for line in lines if line.startswith(("FAIL:", "ERROR:"))]
          message = "; ".join(failed) or "unittest discovered a failing test"
          detail = " | ".join(lines[-25:])
          print("::error title=Python tests::"
                + (message + " | " + detail).replace("%", "%25").replace("\r", " ").replace("\n", "%0A"))
          PY
            then
              echo "::error title=Python tests::unittest failed and its log could not be parsed"
            fi
            exit 1
          fi
          bash -n tools/*.sh
          python3 tools/repack_apk.py --self-test
          python3 tools/render_launcher_art.py --check
          python3 tools/check_no_secrets.py --history
          python3 tools/check_workflow_policy.py
          python3 tools/validate_release.py emit-env --file "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'VERSION_NAME=3.9.0' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'DISPLAY_VERSION=3.9' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'VERSION_CODE=3090000' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'VERSION_TAG=v3.9.0' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'SCRIPT_TAG=s40' "$RUNNER_TEMP/ytark-release.env"
          grep -Fx 'APK_ARMV7=YTArk-v3.9.0-armeabi-v7a.apk' "$RUNNER_TEMP/ytark-release.env"
          # ARMv7 is the only published architecture; an ARM64 asset name must
          # not exist anywhere in the release environment or the active pipeline.
          if grep -q 'ARM64' "$RUNNER_TEMP/ytark-release.env"; then
            echo "The release environment still advertises an ARM64 asset" >&2
            exit 1
          fi
          # tools/tests keeps the historical ARM64 asset names on purpose: they
          # prove that the updater and the checksum contract reject them.
          if grep -rlniE 'cobalt-arm64|APK_ARM64|ytark-dual-abi' \
              .github/workflows/build-apk.yml .github/workflows/publish-release.yml \
              .github/workflows/fetch-premium-logo.yml \
              release README.md docs tools/*.sh tools/*.py; then
            echo "ARM64 release plumbing is still present in the active pipeline" >&2
            exit 1
          fi
          actual_cert="$(openssl x509 -in signing/YTArk-release-cert.pem -outform DER | sha256sum | awk '{print $1}')"
          expected_cert="$(grep -v '^[[:space:]]*#' signing/YTArk-cert-sha256.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          test "$actual_cert" = "$expected_cert"
          grep -Fxq 'communityRepository=2archiver/Hearth' release/signing.properties
          grep -Fq 'enableAdBlock: true' TizenTube/mods/config.js
          grep -Fq "enablePremiumLogo: true" TizenTube/mods/config.js
          grep -Fq 'baseTag=v2.0.2' release/version.properties
          # The release pipeline is automatic: build-apk.yml publishes the
          # verified candidate itself, and no workflow may gate publication on a
          # manual approval stage or on device-acceptance evidence.
          grep -Fq 'group: ytark-release-publication' .github/workflows/build-apk.yml
          grep -Fq 'group: ytark-release-publication' .github/workflows/publish-release.yml
          grep -Fq 'name: Publish the verified ARMv7 APK as the stable release' .github/workflows/build-apk.yml
          if grep -rniE '(device_acceptance|^\s*environment:)' \
              .github/workflows/build-apk.yml \
              .github/workflows/publish-release.yml \
              .github/workflows/fetch-premium-logo.yml; then
            echo "A manual approval/acceptance gate is back in the release workflow" >&2
            exit 1
          fi
          # The production publisher must refuse any repository but the trusted
          # one, classify an empty release as repairable, and treat a complete
          # published release as a no-op.
          python3 tools/publish_release.py self-check

      - name: Compile all native updater sources, run policy tests and produce DEX
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          API_LEVEL: "34"
          BUILD_TOOLS: "34.0.0"
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager "platforms;android-${API_LEVEL}" "build-tools;${BUILD_TOOLS}"
          # The release build path runs the shared host-JRE policy tests, then
          # compiles ALL production sources against the real SDK and runs D8.
          # No signing secrets, release writes or upstream APK are needed.
          bash tools/build_android_updater.sh "$RUNNER_TEMP/ytark-updater/classes.dex"
          test -s "$RUNNER_TEMP/ytark-updater/classes.dex"
          echo "### Native updater validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Policy tests and full Android API $API_LEVEL compilation/D8 passed; classes.dex: $(wc -c < "$RUNNER_TEMP/ytark-updater/classes.dex") bytes. Not device tests." >> "$GITHUB_STEP_SUMMARY"

      - name: Load unsigned repack version
        run: python3 tools/validate_release.py emit-env --file "$GITHUB_ENV"

      - name: Repack the pinned ARMv7 base without signing (integration regression)
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_TOOLS: "34.0.0"
        run: |
          set -euo pipefail
          # Exercise the actual smali assembler/round-trip before merging. Unit
          # fixtures and Kotlin compilation alone cannot validate host DEX edits.
          gh api "repos/reisxd/TizenTubeCobalt/releases/tags/$BASE_TAG" > "$RUNNER_TEMP/base-release.json"
          python3 tools/fetch_base_apks.py \
            --release-json "$RUNNER_TEMP/base-release.json" --base-tag "$BASE_TAG" \
            --output-dir base --checksums-out "$RUNNER_TEMP/base-checksums.txt"
          curl -fsSL --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o "$RUNNER_TEMP/apktool.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/apktool.jar" | sha256sum -c -
          python3 -u tools/repack_apk.py \
            --base base/cobalt-arm.apk --architecture armv7 \
            --out work/ci-unsigned.apk --updater-dex "$RUNNER_TEMP/ytark-updater/classes.dex" \
            --app-name "$APP_NAME" --app-id "$APP_ID" \
            --script-url "https://cdn.jsdelivr.net/gh/2archiver/YTArk@${SCRIPT_TAG}/userScript.js?v=" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --apktool "java -jar $RUNNER_TEMP/apktool.jar" \
            --zipalign "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" 2>&1 | tee "$RUNNER_TEMP/repack.log"

      - name: Verify compiled updater and JNI bridge definitions
        run: |
          set -euo pipefail
          PYTHONPATH=tools python3 -u -c 'from dex_contract import verify_apk_dex; verify_apk_dex("work/ci-unsigned.apk")' 2>&1 | tee "$RUNNER_TEMP/dex-contract.log"

      - name: Verify the packaged manifest and install authorization
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_TOOLS: "34.0.0"
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          # Resolve aapt before anything else: build-tools are not on PATH here,
          # so a bare `aapt` would fail as "command not found" (exit 127) with no
          # hint about what is actually wrong.
          test -x "$aapt" || { echo "::error title=Android build tools::aapt is missing: $aapt"; exit 1; }
          # The Settings "install unknown apps" switch can only stay on for a
          # package that Android 8+ will authorize. PackageManagerService
          # answers that question from the *packaged* manifest: the package must
          # target API 26 or newer and declare REQUEST_INSTALL_PACKAGES. A
          # source-level grep cannot see either, and the standalone updater
          # manifest is not the host APK's manifest, so the compiled bytes of
          # this candidate are parsed here, before anything is signed.
          #
          # tools/apk_manifest.py reads the binary manifest itself, so the same
          # check runs in the unit suite with no SDK at all. Here aapt stays the
          # reference reader as well: both must agree about identity and target
          # SDK, so a bug in either reader is caught instead of shipped.
          echo "### Packaged manifest and install authorization" >> "$GITHUB_STEP_SUMMARY"

          base_json="$(python3 tools/apk_manifest.py inspect --apk base/cobalt-arm.apk --json)"
          base_target="$(printf '%s' "$base_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_sdk"])')"
          base_aapt_target="$("$aapt" dump badging base/cobalt-arm.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'$/\1/p")"
          test "$base_target" = "$base_aapt_target"
          base_facts="$(printf '%s' "$base_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("package=%s versionCode=%s minSdk=%s targetSdk=%s" % (d["package"], d["version_code"], d["min_sdk"], d["target_sdk"]))')"
          echo "Pinned ARMv7 Cobalt base: $base_facts (aapt agrees)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=YTArk pinned base manifest::source=reisxd/TizenTubeCobalt@$BASE_TAG $base_facts"

          candidate_json="$(python3 tools/apk_manifest.py inspect --apk work/ci-unsigned.apk --json)"
          candidate_target="$(printf '%s' "$candidate_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_sdk"])')"
          candidate_aapt_target="$("$aapt" dump badging work/ci-unsigned.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'$/\1/p")"
          test "$candidate_target" = "$candidate_aapt_target"
          candidate_facts="$(printf '%s' "$candidate_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); c=d["install_capability"]; print("package=%s versionCode=%s minSdk=%s targetSdk=%s installCapability=%s%s" % (d["package"], d["version_code"], d["min_sdk"], d["target_sdk"], "yes" if c["can_be_granted"] else "no", "(" + ",".join(c["reasons"]) + ")" if c["reasons"] else ""))')"
          echo "Repacked candidate: $candidate_facts (aapt agrees)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=YTArk candidate manifest::file=work/ci-unsigned.apk $candidate_facts"

          # Fail closed on wrong identity, a target below API 26, a missing or
          # SDK-capped permission, a public Updates screen, an obsolete launcher
          # proxy or provider authorities that do not match the package.
          python3 tools/apk_manifest.py check \
            --apk work/ci-unsigned.apk --package "$APP_ID" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" \
            || { echo "::error title=Packaged manifest contract::The repacked APK does not satisfy the YTArk install-authorization contract"; exit 1; }
          python3 tools/validate_release.py audit-apk \
            --apk work/ci-unsigned.apk --expect-package "$APP_ID" --require-capability

          # Audit the artefact users actually have. This is informational for a
          # pull request (the previous release is immutable), but it tells the
          # maintainer immediately whether the shipped package can be granted
          # install authorization at all, and it is the reference for whether an
          # in-place upgrade from it can be authorized on the device.
          published=""
          mkdir -p "$RUNNER_TEMP/ytark-published"
          # Read-only: the latest release metadata, then the asset URL it names.
          # ci.yml never publishes, tags or edits a release.
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
               > "$RUNNER_TEMP/ytark-published/latest-release.json" 2>/dev/null; then
            # The latest published release carries the current
            # armeabi-v7a filename; releases up to 3.7.x used the
            # internal armv7 key. Either name identifies the one
            # public ARMv7 APK.
            published_url="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(next((a["browser_download_url"] for a in d.get("assets", []) if a["name"].endswith(("-armeabi-v7a.apk", "-armv7.apk"))), ""))' "$RUNNER_TEMP/ytark-published/latest-release.json")"
            if [ -n "$published_url" ]; then
              curl -fsSL --retry 3 "$published_url" -o "$RUNNER_TEMP/ytark-published/published-armv7.apk"
              published="$RUNNER_TEMP/ytark-published/published-armv7.apk"
            fi
          fi
          if [ -n "$published" ]; then
            published_facts="$(python3 tools/apk_manifest.py inspect --apk "$published" --json | python3 -c 'import json,sys; d=json.load(sys.stdin); c=d["install_capability"]; print("package=%s versionCode=%s minSdk=%s targetSdk=%s installCapability=%s%s" % (d["package"], d["version_code"], d["min_sdk"], d["target_sdk"], "yes" if c["can_be_granted"] else "no", "(" + ",".join(c["reasons"]) + ")" if c["reasons"] else ""))')"
            echo "Latest published APK: $published_facts" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::notice title=YTArk published APK manifest::file=$(basename "$published") $published_facts"
            if ! python3 tools/validate_release.py audit-apk --apk "$published" \
                 --expect-package "$APP_ID" --require-capability >/dev/null 2>&1; then
              echo "::warning title=Published APK install authorization::${published_facts} — Android cannot grant this package install authorization (third-party in-place updates from it cannot be authorized); users of this build need the corrected APK"
            fi
          else
            echo "The latest published ARMv7 APK could not be downloaded; its manifest was not audited here." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Published APK not audited::download of the latest release asset failed in this run"
          fi

      - name: Surface repack integration diagnostics
        if: failure()
        run: python3 tools/ci_diagnostics.py "$RUNNER_TEMP/repack.log" "$RUNNER_TEMP/dex-contract.log"
